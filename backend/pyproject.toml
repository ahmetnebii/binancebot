[project]
name = "binancebot"
version = "0.1.0"
description = "Binance USDⓈ-M Futures için risk öncelikli otomatik işlem botu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiohttp>=3.10",
  "numpy>=2.0",
  "cryptography>=43",
  "aiosqlite>=0.20",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
